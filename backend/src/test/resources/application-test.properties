# Test profile: datasource comes from Testcontainers via @ServiceConnection
# (AbstractIntegrationTest) for tests that need a real DB. Everything else
# below gives tests a deterministic, self-contained config independent of
# application-dev/-prod.properties.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=dGVzdC1vbmx5LWp3dC1zaWduaW5nLWtleS1uZXZlci11c2VkLW91dHNpZGUtdGVzdHM=
jwt.expiration-ms=3600000

cors.allowed-origins=http://localhost:5173

file.upload-dir=${java.io.tmpdir}/skillforge-test-uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.com.skillforge=INFO
logging.level.org.springframework.security=WARN
