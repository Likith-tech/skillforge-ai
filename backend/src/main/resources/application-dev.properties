# ===============================
# Dev profile - local machine defaults, active unless SPRING_PROFILES_ACTIVE
# overrides it. Every value here can still be overridden by its env var; the
# fallbacks exist purely so `mvn spring-boot:run` works with zero setup.
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skillforge_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.show-sql=true

# Dev-only signing key so a fresh checkout runs without any secret setup. Never
# used outside this profile - application-prod.properties has no fallback and
# fails startup immediately if JWT_SECRET isn't supplied by the environment.
jwt.secret=${JWT_SECRET:U2tpbGxGb3JnZUFJLURldi1Pbmx5LVNpZ25pbmctS2V5LU5ldmVyLVVzZS1Jbi1Qcm9kdWN0aW9uLTIwMjY=}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging.level.com.skillforge=DEBUG
logging.level.org.springframework.security=INFO
