# ===============================
# Prod profile - every value must come from the environment. There are no
# fallbacks here: a deployment missing one of these variables fails fast at
# startup with "Could not resolve placeholder", which is the intended
# behavior - it's a deployment misconfiguration, not something to paper over
# with a default.
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

logging.level.com.skillforge=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
