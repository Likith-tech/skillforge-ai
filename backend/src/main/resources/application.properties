# ===============================
# Common settings - shared by every profile.
# Anything environment-specific (secrets, datasource, CORS, log levels) lives
# in application-{profile}.properties instead. Active profile defaults to
# "dev" for zero-setup local runs; real deployments must set
# SPRING_PROFILES_ACTIVE=prod explicitly.
# ===============================
spring.application.name=skillforge-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

# ===============================
# Datasource
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
# ddl-auto is replaced by Flyway-managed migrations (see db/migration) once the
# Flyway dependency is wired in; kept here only until that migration lands.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# JWT
# ===============================
# No default here on purpose: each profile supplies its own jwt.secret, and
# application-prod.properties intentionally has no fallback so a deployment
# missing JWT_SECRET fails at startup instead of silently signing tokens with
# a value anyone with repo access could read.
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# File uploads (resumes)
# ===============================
file.upload-dir=${FILE_UPLOAD_DIR:uploads/resumes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
